<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A95monster · Open Source</title>
  <meta name="description" content="Open-source projects by A95monster — Cursor Lab and more." />
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --line: rgba(255,255,255,0.08);
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #5eead4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(94,234,212,0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(96,165,250,0.12), transparent 50%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 32px 16px;
    }
    main {
      width: min(720px, 100%);
      background: color-mix(in srgb, var(--card) 92%, black);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 28px 28px 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.02em; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.6; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      transition: border-color .15s ease, transform .15s ease;
    }
    a.card:hover { border-color: rgba(94,234,212,0.45); transform: translateY(-1px); }
    a.card strong { display: block; margin-bottom: 6px; font-size: 16px; }
    a.card span { color: var(--muted); font-size: 13px; line-height: 1.5; }
    footer { margin-top: 18px; font-size: 12px; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="pill">GitHub Pages · A95monster</div>
    <h1>Open Source</h1>
    <p>个人开源主页。Cursor 相关项目已迁移到专业仓库 <strong>cursor-lab</strong>，按 MCP / Extensions 分类维护。</p>
    <a class="card" href="https://github.com/A95monster/cursor-lab">
      <strong>cursor-lab →</strong>
      <span>Cursor 开源工具合集。当前包含 mcp/cursor-ssh-mcp（SSH 主机、双栏 SFTP、终端、Agent MCP）。</span>
    </a>
    <footer>
      源码：<a href="https://github.com/A95monster/cursor-lab">github.com/A95monster/cursor-lab</a>
      · SSH MCP：<a href="https://github.com/A95monster/cursor-lab/tree/main/mcp/cursor-ssh-mcp">mcp/cursor-ssh-mcp</a>
    </footer>
  </main>
</body>
</html>
