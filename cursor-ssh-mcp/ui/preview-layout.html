<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SSH 布局预览</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #eef6f4;
    }
    #layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100%;
      min-height: 0;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #eef6f4;
    }
    #hosts-frame {
      border-right: 1px solid #b7d4ce;
    }
  </style>
</head>
<body>
  <div id="layout">
    <iframe id="hosts-frame" src="/?panel=hosts" title="主机列表"></iframe>
    <iframe id="work-frame" src="/?panel=work" title="SSH 工作台"></iframe>
  </div>
</body>
</html>
